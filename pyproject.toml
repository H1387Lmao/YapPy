[project]
name = "python-yappy"
version = "0.1.0"
description = "API Bindings for Yapper!"
readme = "README.md"
authors = [
    { name = "H1387Lmao"}
]
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.14.5",
    "load-dotenv>=0.1.0",
    "uv-build>=0.13.1",
]

[tool.uv.build-backend]
module-name = "yappy"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.1"]
build-backend = "uv_build"
